name: "CodeQL"

on:
  push:
    branches: [develop, master]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [develop]
  schedule:
    - cron: '0 3 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # c-cpp: the channel driver; python: the helper scripts in contrib/ and tools/
        language: ['c-cpp', 'python']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    - name: Install dependencies
      if: matrix.language == 'c-cpp'
      # chan-sccp requires Asterisk >= 20 (the asterisk-dev package of ubuntu-latest)
      run: |
        sudo apt-get update
        sudo apt-get install -y asterisk asterisk-dev asterisk-config automake autoconf libtool pkg-config gawk binutils-dev libxml2-dev libxslt1-dev xsltproc libssl-dev

    # The build is done manually (not with codeql-action/autobuild) so that the configure flags are explicit.
    - name: Regenerate configure script
      if: matrix.language == 'c-cpp'
      run: autoreconf -fi

    - name: Configure
      if: matrix.language == 'c-cpp'
      run: ./configure --enable-video --enable-conference --enable-distributed-devicestate --enable-advanced-functions --enable-experimental-xml --with-hash-size=3001

    - name: Build
      if: matrix.language == 'c-cpp'
      run: make -j"$(nproc)"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
